    tier: primary
  - id: pcaob-news
    name: PCAOB news
    url: https://pcaobus.org/rss/news
    topic: audit
    tier: primary
  - id: journal-of-accountancy
    name: Journal of Accountancy
    url: https://www.journalofaccountancy.com/rss/all-news.xml
    topic: accounting
    tier: trade
  - id: accounting-today
    name: Accounting Today
    url: https://www.accountingtoday.com/feed
    topic: accounting
    tier: trade
  - id: cfo-dive
    name: CFO Dive
    url: https://www.cfodive.com/feeds/news/
    topic: finance
    tier: trade
  - id: tax-foundation
    name: Tax Foundation
    url: https://taxfoundation.org/feed/
    topic: tax-policy
    tier: trade
  - id: npr-news
    name: NPR news
    url: https://feeds.npr.org/1001/rss.xml
    topic: general
    tier: general
  - id: nyt-business
    name: New York Times business
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    topic: business
    tier: general
  - id: bbc-business
    name: BBC business
    url: https://feeds.bbci.co.uk/news/business/rss.xml
    topic: business
    tier: general
  - id: wsj-markets
    name: Wall Street Journal markets
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    topic: markets
    tier: general

