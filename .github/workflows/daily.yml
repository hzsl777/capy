name: Daily run
on:
  schedule:
    # 09:00 UTC. The ingest window closes here (packages/core/src/dates.ts). Delivery runs every two hours in deliver.yml.
    - cron: "0 9 * * *"
  # A finished deploy starts the day if its map doesn't exist yet, so going live needs no manual run.
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: Run date (YYYY-MM-DD). Defaults to today.
        required: false
permissions:
  contents: read
jobs:
  day:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Decisions 28 and 29. Unset variables mean OpenAI: gpt-5.4-nano for the bulk stages, gpt-5.4-mini for the word.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MODEL: ${{ vars.MODEL }}
      MODEL_TELEGRAM: ${{ vars.MODEL_TELEGRAM }}
      LLM_BATCH: "true"
      # 312 outlets on the default models cost roughly $0.13 to $0.33 a day (decision 33's figures scaled to
      # decision 45's list). The ceiling stops a runaway day, not a normal one.
      DAILY_SPEND_CEILING_USD: ${{ vars.DAILY_SPEND_CEILING_USD || '1.00' }}
      # The word's score call runs this many times and keeps each event's middle score (decision 36). 1 saves
      # about two cents a day.
      TELEGRAM_SCORE_RUNS: ${{ vars.TELEGRAM_SCORE_RUNS }}
      # Email links. SITE_DOMAIN alone is enough; WEB_BASE_URL overrides it (decision 37).
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || (vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN)) || '' }}
      # 2DayAI reader profiles, one YAML document each, separated by ---. They hold emails, so they live in a
      # secret, not the repository (decision 35). Empty means the map's world desk runs alone.
      READER_PROFILES: ${{ secrets.READER_PROFILES }}
    steps:
      # Until the database and model key exist, the scheduled run skips instead of failing every morning.
      - name: Skip until set up
        if: env.DATABASE_URL == '' || env.LLM_API_KEY == ''
        run: echo "::notice::DATABASE_URL or LLM_API_KEY is not set; skipping. See docs/RUNBOOK.md, 'Launch'."
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm ci
      - if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm run db:migrate
      # One tiny call per model first: a bad key or model id fails here in seconds, with a plain message.
      - name: Check the model key
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm run stage -- llm check
      - name: Run the day
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        env:
          DATE: ${{ inputs.date }}
          IF_MISSING: ${{ github.event_name == 'workflow_run' && '--if-missing' || '' }}
        run: |
          if [ -n "$DATE" ]; then
            npm run stage -- day --date "$DATE" $IF_MISSING
          else
            npm run stage -- day $IF_MISSING
          fi
