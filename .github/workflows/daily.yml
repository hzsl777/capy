name: Daily run
on:
  # Just after midnight UTC, when the day's window closes (decision 81, packages/core/src/dates.ts): the run builds
  # the day that just ended. The Worker's cron trigger starts it at 00:07 on time (decision 91); GitHub's own schedule,
  # which has started it hours late or not at all, stays as a backup. Both build only a day whose map is missing, so the
  # second to start does nothing. Delivery is in deliver.yml.
  schedule:
    - cron: "7 0 * * *"
  # A finished deploy starts the day if its map doesn't exist yet, so going live needs no manual run.
  workflow_run:
    workflows: ["Deploy site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      date:
        description: Run date (YYYY-MM-DD). Defaults to today.
        required: false
      demo_run_id:
        description: Instead of a run, publish this earlier run's map file to the demo-data branch for the demo page.
        required: false
      stage:
        description: Run only this stage for the date instead of the whole day, for example "local" or "telegram".
        required: false
      if_missing:
        description: Only build the day if its map doesn't exist yet ("true"). The Worker's clock sets it.
        required: false
permissions:
  contents: read
jobs:
  day:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && inputs.demo_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # One writer of the map at a time, shared with the refresh during the day (refresh.yml, decision 80).
    concurrency:
      group: map-data
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Decisions 28 and 29. Unset variables mean OpenAI: gpt-5.4-nano for the bulk stages, gpt-5.4-mini for the word.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MODEL: ${{ vars.MODEL }}
      MODEL_TELEGRAM: ${{ vars.MODEL_TELEGRAM }}
      LLM_BATCH: "true"
      # The first live day, 237 outlets and 1,303 articles grouped, cost $0.21. At 560 outlets (decisions 45, 48 and
      # 49) expect roughly $0.40 to $0.70. The ceiling stops a runaway day, not a normal one; watch the summary.
      DAILY_SPEND_CEILING_USD: ${{ vars.DAILY_SPEND_CEILING_USD || '1.00' }}
      # The word's score call runs this many times and keeps each event's middle score (decision 36). 1 saves
      # about two cents a day.
      TELEGRAM_SCORE_RUNS: ${{ vars.TELEGRAM_SCORE_RUNS }}
      # GDELT local stories (decisions 54, 67 and 78), no model cost: the newest per town (default 2; 0 turns them
      # off) and a daily safety valve (default 80000).
      GDELT_PER_TOWN: ${{ vars.GDELT_PER_TOWN }}
      GDELT_MAX: ${{ vars.GDELT_MAX }}
      # Stores the finished map file in R2 for the site (decision 73): R2_API_TOKEN when the site deploys through
      # Cloudflare's Git integration, otherwise the deploy token.
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Email links. SITE_DOMAIN alone is enough; WEB_BASE_URL overrides it (decision 37).
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || (vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN)) || '' }}
      # 2DayAI reader profiles, one YAML document each, separated by ---. They hold emails, so they live in a
      # secret, not the repository (decision 35). Empty means the map's world desk runs alone.
      READER_PROFILES: ${{ secrets.READER_PROFILES }}
    steps:
      # Until the database and model key exist, the scheduled run skips instead of failing every morning.
      - name: Skip until set up
        if: env.DATABASE_URL == '' || env.LLM_API_KEY == ''
        run: echo "::notice::DATABASE_URL or LLM_API_KEY is not set; skipping. See docs/RUNBOOK.md, 'Launch'."
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        with:
          node-version: 22
          cache: npm
      - if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm ci
      - if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm run db:migrate
      # One tiny call per model first: a bad key or model id fails here in seconds, with a plain message.
      - name: Check the model key
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm run stage -- llm check
      - name: Run the day
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        env:
          DATE: ${{ inputs.date }}
          STAGE: ${{ inputs.stage }}
          IF_MISSING: ${{ (github.event_name == 'workflow_run' || github.event_name == 'schedule' || inputs.if_missing == 'true') && '--if-missing' || '' }}
        run: |
          # One stage alone, named in words only, so the input can't smuggle in anything else.
          if [ -n "$STAGE" ]; then
            if ! [[ "$STAGE" =~ ^[a-z]+(\ [a-z]+)?$ ]]; then echo "::error::stage must be one or two lowercase words"; exit 1; fi
            npm run stage -- $STAGE ${DATE:+--date "$DATE"}
          elif [ -n "$DATE" ]; then
            npm run stage -- day --date "$DATE" $IF_MISSING
          else
            npm run stage -- day $IF_MISSING
          fi
      # The day's map as a downloadable file, kept a week: what the site shows, for checking a day or loading it into
      # a demo without database access (decision 41). Its local stories go in tiles beside it, in local/<date>/, and
      # tiles.json lists them for R2 (decision 78).
      - name: Export the map
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        run: npm run -s stage -- map export --out map.json --manifest tiles.json
      # The site's copy: the Worker streams these files from R2 instead of building the map on every request, which
      # takes longer than the free plan's 10 ms (decision 73). The day's tiles first, 20 at a time, then the day's
      # file, so a file never lists a tile that isn't stored yet (decision 78). latest.json and the day's own date;
      # a run for an earlier date also refreshes that date's files. A file that fails the checks (not JSON, no outlet
      # stories, no explained event and no local story, a listed tile missing) stops the step before anything is
      # stored, so the site keeps the file it has. Each upload is tried three times, as R2 and the network blip.
      - name: Store the map for the site
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          DATE: ${{ inputs.date }}
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::upload attempt $i of 3 failed"; [ "$i" = 3 ] || sleep $((i * 20)); done; return 1; }
          put() { retry npx wrangler r2 object put "globalgist-maps/$1" --file "$2" --content-type application/json --remote; }
          tiles() { if [ "$(node -p "require('./$1').length")" != "0" ]; then retry npx wrangler r2 bulk put globalgist-maps --filename "$1" --content-type application/json --remote --force; fi; }
          npm run -s stage -- map check --in map.json --manifest tiles.json
          day=$(node -p 'require("./map.json").runDate')
          tiles tiles.json
          put "$day.json" map.json
          put latest.json map.json
          if [ -n "$DATE" ] && [ "$DATE" != "$day" ]; then
            if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::date must be YYYY-MM-DD"; exit 1; fi
            npm run -s stage -- map export --date "$DATE" --out dated.json --manifest dated-tiles.json
            npm run -s stage -- map check --in dated.json --manifest dated-tiles.json
            tiles dated-tiles.json
            put "$DATE.json" dated.json
          fi
      # The day's share image (decision 92): the word, its date and the day's places, 1200 by 630, for link previews.
      # A failure here never fails the day; the site then keeps the last image, or the timeless one.
      - name: Store the share image
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != '' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          node tools/share-image.mjs og.png map.json "$(command -v google-chrome || command -v chromium)"
          npx wrangler r2 object put globalgist-maps/og.png --file og.png --content-type image/png --remote
      - uses: actions/upload-artifact@v4
        if: env.DATABASE_URL != '' && env.LLM_API_KEY != ''
        with:
          name: map
          path: |
            map.json
            local/
          retention-days: 7

  # A day's map file on its own branch, so a session that can reach GitHub over git but not the artifact store can
  # load it into the demo page. No secrets here; only this job can push, and only to demo-data.
  demo-data:
    if: github.event_name == 'workflow_dispatch' && inputs.demo_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: map
          run-id: ${{ inputs.demo_run_id }}
          github-token: ${{ github.token }}
      - name: Push to demo-data
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir demo && mv map.json demo/ && if [ -d local ]; then mv local demo/; fi && cd demo
          git init -q -b demo-data
          git add map.json $( [ -d local ] && echo local )
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Map file for the demo page"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" demo-data
