name: Daily run
on:
  schedule:
    # 09:00 UTC, which is 05:00 Eastern in summer and 04:00 in winter. Ingest window closes here (core/dates.ts).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Run date (YYYY-MM-DD). Defaults to today.
        required: false
jobs:
  day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      MODEL: claude-sonnet-5
      DAILY_SPEND_CEILING_USD: "1.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Run the day
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            npm run stage -- day --date "${{ inputs.date }}"
          else
            npm run stage -- day
          fi
