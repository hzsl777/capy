# Builds the public map and deploys it with the Worker (packages/web), which serves the map's static files
# and its data (/data/latest.json) straight from the database. The daily run changes the data, not the code,
# so this runs only when code changes or by hand. Cloudflare's free plan hosts it; the repository can stay private.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # A domain on this Cloudflare account, for example globalgist.com (decision 37). Empty means workers.dev only.
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - name: Skip until Cloudflare is set up
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the deploy. See docs/RUNBOOK.md, 'Deploy the site'."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run check
      # Custom domains make Cloudflare create the DNS records and the certificate itself. The routes key has to sit
      # above the [assets] table, so it is inserted there rather than appended.
      - name: Use the custom domain
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SITE_DOMAIN != ''
        run: |
          domain="${SITE_DOMAIN#www.}"
          sed -i "/^\[assets\]/i workers_dev = true\nroutes = [\n  { pattern = \"$domain\", custom_domain = true },\n  { pattern = \"www.$domain\", custom_domain = true },\n]\n" packages/web/wrangler.toml
          cat packages/web/wrangler.toml
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run web:deploy
      # The Worker reads the map from the database. Copying the repository secret on every deploy keeps the two
      # in step with no manual wrangler command.
      - name: Give the Worker the database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.DATABASE_URL != ''
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --config packages/web/wrangler.toml
