name: Deliver
on:
  # 2DayAI email is parked (decision 40): no schedule, so it spends no Actions minutes. To turn email on, restore:
  #   schedule:
  #     - cron: "5 */2 * * *"
  # Every two hours sends editions whose reader's local hour has reached their delivery hour. Idempotent.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # Email links. SITE_DOMAIN alone is enough; WEB_BASE_URL overrides it (decision 37).
      WEB_BASE_URL: ${{ vars.WEB_BASE_URL || (vars.SITE_DOMAIN && format('https://{0}', vars.SITE_DOMAIN)) || '' }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
    steps:
      # 2DayAI email is not live yet. Without a Resend key there is nothing to send, so skip in seconds.
      - name: Skip until email is set up
        if: env.RESEND_API_KEY == '' || env.DATABASE_URL == ''
        run: echo "::notice::RESEND_API_KEY or DATABASE_URL is not set; skipping delivery."
      - uses: actions/checkout@v4
        if: env.RESEND_API_KEY != '' && env.DATABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.RESEND_API_KEY != '' && env.DATABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - if: env.RESEND_API_KEY != '' && env.DATABASE_URL != ''
        run: npm ci
      - if: env.RESEND_API_KEY != '' && env.DATABASE_URL != ''
        run: npm run stage -- deliver
