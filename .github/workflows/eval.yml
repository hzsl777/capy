name: Model eval
# Manual only, so it costs Actions minutes only when started. Compares model setups on one day's world
# articles (decision 28). Download the report from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      date:
        description: Run date (YYYY-MM-DD). Defaults to today.
        required: false
      setups:
        description: 'Setups split by ";". Empty runs the default comparison (docs/RUNBOOK.md, "Choose a model").'
        required: false
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # With DATABASE_URL the day comes from the database; without it, from the live feeds.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Each setup gets its own in-memory database, so this ceiling applies per setup.
      DAILY_SPEND_CEILING_USD: "1.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the eval
        env:
          DATE: ${{ inputs.date }}
          SETUPS: ${{ inputs.setups }}
        run: |
          args=(eval)
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ -n "$SETUPS" ]; then args+=(--setups "$SETUPS"); fi
          npm run stage -- "${args[@]}"
      # The report only. The snapshot holds the outlets' article text and stays on the runner.
      - uses: actions/upload-artifact@v4
        with:
          name: model-eval
          path: |
            .eval/report-*.md
            .eval/report-*.json
