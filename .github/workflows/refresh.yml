name: Refresh local stories
# Between daily runs, every three hours: the latest map's local stories become the last 24 hours' of GDELT (decision 80),
# and the outlets' new stories of the day under way are read and grouped by the model and added beside the finished
# day's (decision 130). The finished day's events and word stay the daily run's. The repository is public, so Actions
# minutes are not counted.
# The Worker's cron trigger starts it every three hours at minute 41 (decision 91); GitHub's own schedule skipped
# runs for hours, and is no longer used here, so a run is never started twice.
# It no longer follows each daily run: the daily run has just stored the same day's local stories, and each run reads
# the whole map back from the database, whose free plan allows 5 GB of transfer a month (decision 124).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One writer of the map at a time: a refresh waits for a daily run in progress, and the other way round, so an
    # older day's file never replaces a newer one in R2.
    concurrency:
      group: map-data
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GDELT_PER_TOWN: ${{ vars.GDELT_PER_TOWN }}
      # The model groups the day's new articles (decision 130), at the standard price so a run takes minutes, not the
      # flex queue's wait; it stops at a quarter of the day's spend ceiling, leaving the rest for the daily run's word.
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MODEL: ${{ vars.MODEL }}
      LLM_BATCH: "false"
      DAILY_SPEND_CEILING_USD: ${{ vars.DAILY_SPEND_CEILING_USD || '1.00' }}
      GDELT_MAX: ${{ vars.GDELT_MAX }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until set up
        if: env.DATABASE_URL == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::DATABASE_URL or the R2 token is not set; skipping. See docs/RUNBOOK.md, 'Launch'."
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci
      # A refresh can run before the next daily run, so it brings the tables up to date the same way first.
      - if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run db:migrate
      # The file the site already has: the refresh swaps its local stories for the new ones instead of reading the whole
      # day back from the database, whose free plan allows 5 GB of transfer a month (decision 124). Without it, the
      # refresh exports the day from the database as before.
      - name: Fetch the published map
        if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler r2 object get globalgist-maps/latest.json --file base.json --remote || echo "::warning::no published map to start from; exporting from the database"
      - name: Refresh the local stories
        id: refresh
        if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -o pipefail
          npm run -s stage -- refresh --outlets --in base.json --out map.json --manifest tiles.json | tee refresh.txt
          if grep -q "nothing to refresh" refresh.txt; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      # The same checks and order as the daily run: nothing is stored from a broken file, then the tiles first, then the
      # day's file that lists them, each upload tried three times.
      - name: Store the map for the site
        if: env.DATABASE_URL != '' && env.CLOUDFLARE_API_TOKEN != '' && steps.refresh.outputs.skip != '1'
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "::warning::upload attempt $i of 3 failed"; [ "$i" = 3 ] || sleep $((i * 20)); done; return 1; }
          put() { retry npx wrangler r2 object put "globalgist-maps/$1" --file "$2" --content-type application/json --remote; }
          npm run -s stage -- map check --in map.json --manifest tiles.json
          day=$(node -p 'require("./map.json").runDate')
          if [ "$(node -p "require('./tiles.json').length")" != "0" ]; then retry npx wrangler r2 bulk put globalgist-maps --filename tiles.json --content-type application/json --remote --force; fi
          put "$day.json" map.json
          put latest.json map.json
          # A daily run GitHub dropped or cancelled sends no email. The refresh does: from the third day without a
          # finished daily run it fails after storing, every run until one finishes.
          if [[ "$day" < "$(date -u -d '2 days ago' +%F)" ]]; then
            echo "::error::The newest finished map is for $day. The daily run has not finished a day since; see its runs in the Actions tab."
            exit 1
          fi
