# The public site is GlobalGist (decision 27), so its free address is globalgist.<account>.workers.dev.
# The config sits at the repository root so a plain `npx wrangler deploy` works from here: that is what
# Cloudflare's Git integration (Workers Builds) runs, and what `npm run web:deploy` runs (decision 38).
name = "globalgist"
main = "packages/web/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# Every deploy (Workers Builds runs one on each merge) deletes variables added in the dashboard as Text unless this is
# set; secrets are never deleted. Without it, settings typed into the dashboard vanished at the next merge (decision 115).
keep_vars = true
# Secrets: DATABASE_URL. The "Deploy site" workflow copies it from GitHub; with Workers Builds alone, add it
# under the Worker's Settings, then Variables and Secrets.

# Runs before every deploy: builds the map, then drops the fictional sample and any exported day, with their tiles of
# local stories, so the live site never falls back to them and a static file never hides the Worker's /data/local/.
[build]
command = "npm run map:build && rm -rf packages/map/dist/data/sample.json packages/map/dist/data/latest.json packages/map/dist/data/local"

# The public map (packages/map). Files that exist are served as-is; everything else, including /data/*.json and
# the reader pages, falls through to the Worker.
[assets]
directory = "packages/map/dist"

# The day's finished map files, stored by the daily run (decision 73): latest.json, one per date, and the day's
# tiles of local stories at local/<date>/<tile>.json (decision 78). The Worker streams them instead of building the
# map on each request. Create the bucket once before deploying: docs/RUNBOOK.md, "Map files in R2".
[[r2_buckets]]
binding = "MAPS"
bucket_name = "globalgist-maps"

# Machine translation for the map's Translate button (decision 97): Cloudflare Workers AI, on the free daily allowance.
[ai]
binding = "AI"

# The Worker's logs, kept by Cloudflare (Workers & Pages, globalgist, Logs), so the clock's attempts and any failure
# are on record. The free plan keeps up to 200,000 events a day.
[observability]
enabled = true

# The site's clock (decision 91): Cloudflare starts the GitHub runs on time. 00:07 UTC the daily run (only if its day
# is missing), every three hours at minute 41 the refresh. Needs the secret GITHUB_DISPATCH_TOKEN (docs/RUNBOOK.md).
[triggers]
crons = ["7 0 * * *", "41 */3 * * *"]
